# Render Blueprint for the Colyseus server (ADR-0007). The web app deploys to Vercel.
services:
  - type: web
    name: bumbadum-server
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@bumbadum/server..." && pnpm --filter @bumbadum/server build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    buildFilter:
      paths:
        # Every workspace package the server depends on.
        - apps/server/**
        - packages/avatar/**
        - packages/chat/**
        - packages/protocol/**
        - packages/radio/**
        - packages/tooling/**
        - packages/world/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
      ignoredPaths:
        - "**/*.test.ts"
    envVars:
      # Node 24 still ships corepack, which provides the pnpm pinned in package.json.
      - key: NODE_VERSION
        value: "24"
      # YouTube Data API key for videos.list (ADR-0005). A secret: set it in the
      # Render dashboard; it never reaches the client. Without it, /play answers
      # with a notice.
      - key: YOUTUBE_API_KEY
        sync: false
